<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horloge AYNEHA</title>
<meta name="description" content="Horloge et calendrier AYNEHA en direct : heure, jour, mois et année dans l'écriture songhay.">
<meta name="theme-color" content="#0b1526">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Horloge AYNEHA">
<style>
  @font-face{
    font-family:"AYNEHA";
    src:url("ayneha_regular.ttf") format("truetype");
    font-display:swap;
  }

  :root{
    --indigo-950:#0b1526;
    --indigo-900:#101b30;
    --indigo-800:#182642;
    --sand:#f1e8d8;
    --sand-dim:#d9cdb4;
    --gold:#c6912f;
    --gold-bright:#e0ac47;
    --line:rgba(241,232,216,0.14);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--indigo-900);
    color:var(--sand);
    font-family:"AYNEHA","Space Grotesk",system-ui,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:calc(1.2rem + env(safe-area-inset-top)) 1.2rem calc(1.2rem + env(safe-area-inset-bottom));
    direction:rtl;
  }

  .hc-panel{
    background:var(--indigo-800);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.6rem 1.4rem 1.8rem;
    max-width:920px;
    width:100%;
    box-shadow:0 14px 48px rgba(0,0,0,0.5);
  }

  .hc-widget{display:flex;flex-direction:row;gap:2rem;align-items:flex-start;}
  .hc-right{flex:1 1 50%;width:50%;min-width:0;overflow:hidden;padding-left:0.8rem;box-sizing:border-box;}
  .hc-left{
    flex:1 1 50%;width:50%;min-width:0;overflow:hidden;
    border-right:1px solid var(--line);padding-right:1.4rem;box-sizing:border-box;
  }
  @media (orientation:portrait){
    .hc-widget{flex-direction:column;}
    .hc-right,.hc-left{flex:none;width:100%;max-width:none;}
    .hc-left{border-right:none;padding-right:0;border-bottom:1px solid var(--line);padding-bottom:1.2rem;margin-bottom:0.5rem;}
  }

  .hc-label{
    font-size:1.425rem;color:var(--sand-dim);letter-spacing:0.06em;margin-bottom:0.35rem;
    direction:rtl;unicode-bidi:bidi-override;text-align:center;
  }
  .hc-right .hc-label{font-size:1.71rem;}

  .hc-time{
    font-size:clamp(2.4rem,8vw,3.2rem);letter-spacing:0.1em;color:var(--gold-bright);
    line-height:1.15;margin-bottom:1.4rem;direction:ltr;unicode-bidi:isolate;text-align:center;
  }

  .hc-divider{height:1px;background:var(--line);margin:0 0 1.3rem;}

  .hc-info-row{display:flex;flex-direction:column;gap:1rem;margin-bottom:0.8rem;text-align:center;}
  .hc-info-top{display:flex;justify-content:space-between;gap:0.6rem;}
  .hc-info-top .hc-block{flex:1;min-width:0;}
  .hc-info-top .hc-info-divider{width:1px;align-self:stretch;background:var(--line);flex-shrink:0;}
  .hc-block{flex:none;width:100%;}
  .hc-year-block{margin-top:0.3rem;}
  .hc-year-divider{height:1px;background:var(--line);margin-bottom:0.8rem;}

  .hc-value{
    font-size:clamp(1.1rem,3.5vw,1.45rem);letter-spacing:0.04em;margin-top:0.25rem;
    direction:rtl;unicode-bidi:bidi-override;color:var(--sand);
  }
  .hc-right .hc-value{font-size:clamp(2.2rem,7vw,2.9rem);}
  .hc-value.accent{color:var(--gold-bright);}
  #hcYearName{direction:ltr;unicode-bidi:isolate;}

  .hc-cal-header{text-align:center;margin-bottom:0.7rem;}
  .hc-cal-month{
    font-size:clamp(2.025rem,6.3vw,2.55rem);color:var(--gold-bright);letter-spacing:0.05em;
    direction:rtl;unicode-bidi:bidi-override;
  }
  .hc-cal-nav{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:0.7rem;
    font-size:2.25rem;color:var(--sand-dim);user-select:none;
  }
  .hc-cal-nav span{cursor:pointer;padding:0.15rem 0.7rem;border-radius:8px;transition:background .15s,color .15s;}
  .hc-cal-nav span:hover{background:rgba(198,145,47,0.18);color:var(--gold-bright);}

  .hc-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:0.35rem;text-align:center;}
  .hc-weekday{
    font-size:1.49rem;color:var(--sand-dim);padding:0.35rem 0;letter-spacing:0.02em;
    direction:rtl;unicode-bidi:bidi-override;overflow:hidden;white-space:nowrap;
  }
  .hc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
  .hc-day{
    aspect-ratio:5/3;display:flex;align-items:center;justify-content:center;font-size:1.425rem;
    border-radius:8px;direction:rtl;unicode-bidi:bidi-override;color:var(--sand);min-height:0;
  }
  .hc-day.empty{visibility:hidden;}
  .hc-day.today{background:rgba(198,145,47,0.22);color:var(--gold-bright);box-shadow:inset 0 0 0 1.5px var(--gold-bright);}
</style>
</head>
<body>

<div class="hc-panel">
  <div class="hc-widget">

    <div class="hc-right">
      <div class="hc-label" id="hcLabelGuuru"></div>
      <div class="hc-time" id="hcClock"></div>

      <div class="hc-divider"></div>

      <div class="hc-info-row">
        <div class="hc-info-top">
          <div class="hc-block">
            <div class="hc-label" id="hcLabelHan"></div>
            <div class="hc-value" id="hcDayName"></div>
          </div>
          <div class="hc-info-divider"></div>
          <div class="hc-block">
            <div class="hc-label" id="hcLabelHadu"></div>
            <div class="hc-value" id="hcMonthName"></div>
          </div>
        </div>
        <div class="hc-year-divider"></div>
        <div class="hc-block hc-year-block">
          <div class="hc-label" id="hcLabelAnnee"></div>
          <div class="hc-value accent" id="hcYearName"></div>
        </div>
      </div>
    </div>

    <div class="hc-left">
      <div class="hc-cal-header">
        <div class="hc-cal-month" id="hcCalMonth"></div>
      </div>
      <div class="hc-cal-nav">
        <span id="hcPrevMonth">&#x2039;</span>
        <span id="hcNextMonth">&#x203A;</span>
      </div>
      <div class="hc-weekdays" id="hcWeekdays"></div>
      <div class="hc-days" id="hcDays"></div>
    </div>

  </div>
</div>

<script>
  const HC_DIG = ['\uE000','\uE001','\uE002','\uE003','\uE004','\uE005','\uE006','\uE007','\uE008','\uE009'];

  const HC_LBL = {
    guuru: '\uE01C\uE02F\uE013\uE024',
    han:   '\uE01E\uE020\uE040',
    hadu:  '\uE01E\uE026\uE00F\uE024'
  };

  const HC_DAYS_FULL = [
    '\uE00D\uE020\uE01E\uE026\uE010\uE021\uE019\uE022',
    '\uE00C\uE020\uE01E\uE026\uE010\uE021\uE019\uE022',
    '\uE00A\uE023\uE01E\uE026\uE010\uE021\uE019\uE022',
    '\uE00E\uE023\uE050\uE01E\uE026\uE010\uE021\uE019\uE022',
    '\uE010\uE023\uE01E\uE026\uE010\uE021\uE019\uE022',
    '\uE015\uE02B\uE00A\uE024\uE015\uE020',
    '\uE00F\uE024\uE01E\uE026\uE010\uE021\uE019\uE022'
  ];

  const HC_DAYS_SHORT = [
    '\uE00D\uE020\uE01E',
    '\uE00C\uE020\uE01E',
    '\uE00A\uE023\uE01E',
    '\uE00E\uE023\uE050',
    '\uE010\uE023\uE01E',
    '\uE015\uE02B\uE00A',
    '\uE00F\uE024\uE01E'
  ];

  const HC_MONTHS = [
    '\uE00F\uE020\uE00F\uE020\uE03A\uE00A\uE027\uE013\uE022',
    '\uE00F\uE020\uE00F\uE020\uE03A\uE01D\uE020\uE050\uE011\uE020',
    '\uE01C\uE025\uE011\uE022',
    '\uE01C\uE025\uE011\uE022\uE00A\uE026\uE00F\uE020',
    '\uE00A\uE02B\uE01D\uE024\uE011\uE020',
    '\uE00A\uE02B\uE00A\uE022\uE011\uE020',
    '\uE00E\uE023\uE050\uE015\uE021\uE011\uE020',
    '\uE017\uE021\uE01D\uE02E\uE03F\uE020',
    '\uE00C\uE027\uE01E\uE020\uE03A',
    '\uE00C\uE027\uE00D\uE027\uE013\uE022',
    '\uE01E\uE024\uE011\uE026\uE015\uE020\uE036',
    '\uE017\uE022\uE032\uE014\uE022'
  ];

  function hcToAy(n) {
    return String(n).split('').map(c => HC_DIG[+c]).join('');
  }
  function hcToAy2Rev(n) {
    const s = String(n).padStart(2,'0');
    return hcToAy(s[1] + s[0]);
  }

  let hcViewYear, hcViewMonth;

  function hcUpdateClock() {
    const now = new Date();
    document.getElementById('hcClock').textContent =
      hcToAy2Rev(now.getSeconds()) + ':' +
      hcToAy2Rev(now.getMinutes()) + ':' +
      hcToAy2Rev(now.getHours());

    document.getElementById('hcDayName').textContent  = HC_DAYS_FULL[now.getDay()];
    document.getElementById('hcMonthName').textContent = HC_MONTHS[now.getMonth()];

    const songhayYear = now.getFullYear() + 2001;
    const yearRev = String(songhayYear).split('').reverse().join('');
    document.getElementById('hcYearName').textContent = hcToAy(yearRev);
  }

  function hcRenderCalendar() {
    const now = new Date();
    document.getElementById('hcCalMonth').textContent = HC_MONTHS[hcViewMonth];

    const wd = document.getElementById('hcWeekdays');
    wd.innerHTML = '';
    HC_DAYS_SHORT.forEach(d => {
      const el = document.createElement('div');
      el.className = 'hc-weekday';
      el.textContent = d;
      wd.appendChild(el);
    });

    const first = new Date(hcViewYear, hcViewMonth, 1);
    const last  = new Date(hcViewYear, hcViewMonth + 1, 0);
    const startDow = first.getDay();
    const total = last.getDate();

    const daysEl = document.getElementById('hcDays');
    daysEl.innerHTML = '';

    for (let i = 0; i < startDow; i++) {
      const e = document.createElement('div');
      e.className = 'hc-day empty';
      daysEl.appendChild(e);
    }

    for (let d = 1; d <= total; d++) {
      const cell = document.createElement('div');
      cell.className = 'hc-day';
      cell.textContent = hcToAy(d);
      if (hcViewYear === now.getFullYear() &&
          hcViewMonth === now.getMonth() &&
          d === now.getDate()) {
        cell.classList.add('today');
      }
      daysEl.appendChild(cell);
    }
  }

  document.getElementById('hcPrevMonth').addEventListener('click', () => {
    hcViewMonth--;
    if (hcViewMonth < 0) { hcViewMonth = 11; hcViewYear--; }
    hcRenderCalendar();
  });
  document.getElementById('hcNextMonth').addEventListener('click', () => {
    hcViewMonth++;
    if (hcViewMonth > 11) { hcViewMonth = 0; hcViewYear++; }
    hcRenderCalendar();
  });

  document.getElementById('hcLabelGuuru').textContent = HC_LBL.guuru;
  document.getElementById('hcLabelHan').textContent   = HC_LBL.han;
  document.getElementById('hcLabelHadu').textContent  = HC_LBL.hadu;
  document.getElementById('hcLabelAnnee').textContent = '';

  const hcNow = new Date();
  hcViewYear  = hcNow.getFullYear();
  hcViewMonth = hcNow.getMonth();

  hcUpdateClock();
  hcRenderCalendar();
  setInterval(hcUpdateClock, 1000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>
</body>
</html>
