<title>AYNEHA Horloge</title>
<meta name="description" content="Horloge et calendrier AYNEHA : heure, jour, mois grégorien et mois lunaire songhay, en écriture AYNEHA.">

<style>
  @font-face{
    font-family:"AYNEHA";
    src:url("ayneha_pro.ttf") format("truetype");
    font-display:block;
  }

  :root{
    --night-950:#08101e;
    --night-900:#0b1526;
    --night-800:#13213a;
    --night-700:#1c2d4c;
    --ink:#f3ece0;
    --ink-dim:#b9c0cf;
    --orange:#ff6a13;
    --orange-soft:#ff8a3d;
    --orange-glow:rgba(255,106,19,0.18);
    --line:rgba(243,236,224,0.13);
    --moon-lit:#f6e7c8;
    --moon-dark:#22324f;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--night-950);}
  body{
    background:var(--night-950);
    color:var(--ink);
    font-family:"AYNEHA",system-ui,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:calc(0.8rem + env(safe-area-inset-top)) 0.8rem calc(0.8rem + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  /* Dans l'application, laisse la place au bouton Confidentialité (coin haut-gauche). */
  body.in-app .bar{padding-left:3.4rem;}

  /* ---------- Moteur RTL : chaque glyphe est une case placée de droite à gauche ---------- */
  .ay{display:inline-flex;flex-direction:row;direction:rtl;unicode-bidi:isolate;align-items:baseline;white-space:nowrap;}
  .ay > span{display:inline-block;}
  .ay .sep{padding:0 0.12em;}

  /* ---------- Barre d'outils (icônes uniquement) ---------- */
  .bar{
    width:100%;max-width:980px;display:flex;flex-direction:row;gap:0.35rem;
    justify-content:flex-start;align-items:center;margin:0 auto 0.6rem;min-height:2.6rem;
  }
  .ico{
    width:2.6rem;height:2.6rem;border-radius:12px;border:1px solid var(--line);
    background:var(--night-800);color:var(--ink-dim);display:inline-flex;
    align-items:center;justify-content:center;cursor:pointer;flex:none;
  }
  .ico svg{width:1.35rem;height:1.35rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .ico:active,.ico.on{background:var(--orange-glow);color:var(--orange-soft);border-color:var(--orange);}
  .ico.idle{opacity:0.35;pointer-events:none;}
  .ico.warn{color:var(--orange);border-color:var(--orange);}
  .bar .grow{flex:1;}

  /* ---------- Panneau principal ---------- */
  .panel{
    background:var(--night-800);border:1px solid var(--line);border-radius:18px;
    padding:1.3rem 1.1rem 1.4rem;width:100%;max-width:980px;margin:0 auto;
    box-shadow:0 14px 48px rgba(0,0,0,0.45);
    display:flex;flex-direction:row;gap:1.6rem;align-items:stretch;
  }
  .info,.cal{flex:1 1 50%;min-width:0;}
  .info{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .cal{border-right:1px solid var(--line);padding-right:1.4rem;}
  @media (orientation:portrait), (max-width:700px){
    .panel{flex-direction:column;gap:1rem;}
    .cal{border-right:none;padding-right:0;border-top:1px solid var(--line);padding-top:1rem;}
  }

  .lbl{font-size:1.25rem;color:var(--ink-dim);margin-bottom:0.25rem;}
  .hr{height:1px;background:var(--line);width:100%;margin:0.9rem 0;}

  /* Horloge numérique */
  .clock{font-size:clamp(2.5rem,11vw,3.6rem);color:var(--orange-soft);line-height:1.2;cursor:pointer;}
  .clock .ay{gap:0.06em;}
  /* Cadran à aiguilles */
  .dial{width:min(62vw,15rem);height:min(62vw,15rem);cursor:pointer;display:none;}
  .dial-mode .clock{display:none;}
  .dial-mode .dial{display:block;}
  .dial text{font-family:"AYNEHA";fill:var(--ink);}

  .row2{display:flex;flex-direction:row;width:100%;align-items:stretch;}
  .row2 > div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .row2 .vline{flex:none;width:1px;background:var(--line);}
  .val{font-size:clamp(1.6rem,6.5vw,2.2rem);color:var(--ink);}
  .moon{width:3.4rem;height:3.4rem;}

  .lunar{font-size:clamp(1.9rem,8vw,2.6rem);color:var(--orange-soft);display:flex;flex-direction:row;gap:0.45em;justify-content:center;align-items:baseline;flex-wrap:wrap;}
  .year{font-size:clamp(1.7rem,7vw,2.3rem);color:var(--ink);}
  .greg{font-size:1.35rem;color:var(--ink-dim);margin-top:0.55rem;}

  /* ---------- Calendrier ---------- */
  .cal-head{display:flex;flex-direction:row;align-items:center;gap:0.3rem;margin-bottom:0.6rem;}
  .cal-titles{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0.2rem;}
  .cal-greg{font-size:clamp(1.7rem,7vw,2.2rem);color:var(--ink);display:flex;flex-direction:row;gap:0.4em;align-items:baseline;justify-content:center;flex-wrap:wrap;}
  .cal-lunar{font-size:1.25rem;color:var(--orange-soft);display:flex;flex-direction:row;gap:0.5em;flex-wrap:wrap;justify-content:center;}
  .cal-lunar .dot{color:var(--ink-dim);}
  .nav{width:2.8rem;height:2.8rem;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-dim);flex:none;}
  .nav svg{width:1.6rem;height:1.6rem;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .nav:active{background:var(--orange-glow);color:var(--orange-soft);}

  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;direction:rtl;}
  .wd{font-size:clamp(0.95rem,3.9vw,1.25rem);color:var(--ink-dim);text-align:center;padding:0.2rem 0 0.35rem;overflow:hidden;}
  .day{
    position:relative;border-radius:10px;padding:0.3rem 0 0.25rem;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:0.05rem;cursor:pointer;min-height:3.1rem;
  }
  .day.empty{visibility:hidden;}
  .wd.off{color:var(--orange-soft);}
  .day.off{background:rgba(255,106,19,0.06);}
  .day .big{font-size:clamp(1.15rem,4.6vw,1.45rem);color:var(--ink);line-height:1.1;}
  .day .small{font-size:clamp(0.75rem,3vw,0.9rem);color:var(--orange-soft);opacity:0.85;line-height:1;}
  .day.mstart{box-shadow:inset 0 2px 0 var(--orange);}
  .day.mstart .small{opacity:1;}
  .day .pastilles{position:absolute;top:4px;left:5px;display:flex;gap:2px;}
  .fete,  .fete-mali,  .fete-rel{display:inline-block;width:6px;height:6px;border-radius:50%;}
  .fete{background:var(--orange);}
  .fete-mali{background:#f3ece0;}
  .fete-rel{background:#5fd0a0;}
  .fete-ligne{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;font:600 .9rem/1.3 system-ui,sans-serif;color:var(--ink-dim);}
  .fete-ligne i{width:8px;height:8px;}
  .day.today{background:var(--orange-glow);box-shadow:inset 0 0 0 1.5px var(--orange);}
  .day.today .big{color:var(--orange-soft);}
  .day.sel{background:rgba(243,236,224,0.08);}

  .foot{font-family:system-ui,sans-serif;direction:ltr;font-size:0.7rem;letter-spacing:0.08em;color:var(--ink-dim);opacity:0.5;margin-top:0.8rem;}

  /* ---------- Fiches (détail du jour, réglage) ---------- */
  .sheet-bg{position:fixed;inset:0;background:rgba(4,8,16,0.6);display:none;align-items:flex-end;justify-content:center;z-index:20;}
  .sheet-bg.open{display:flex;}
  .sheet{
    width:100%;max-width:560px;background:var(--night-800);border:1px solid var(--line);border-bottom:none;
    border-radius:20px 20px 0 0;padding:1.2rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:0.55rem;text-align:center;
  }
  .sheet .big{font-size:clamp(2rem,9vw,2.8rem);color:var(--orange-soft);}
  .sheet .mid{font-size:1.6rem;color:var(--ink);}
  .sheet .small{font-size:1.25rem;color:var(--ink-dim);}
  .sheet .moon{width:4rem;height:4rem;}
  .sheet .fetes{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem 1rem;}
  .sheet .fetes:empty{display:none;}
  .fete-pays{display:flex;flex-direction:column;align-items:center;gap:.25rem;}
  .fete-pays .flag{width:3rem;height:2rem;border-radius:3px;box-shadow:0 0 0 1px rgba(243,236,224,0.25);}
  .pays{font-size:1.6rem;color:var(--ink);}
  .adj{display:flex;flex-direction:row;align-items:center;gap:1rem;}
  .adj .ico{width:3rem;height:3rem;}
  .adj .num{font-size:1.9rem;min-width:3.5rem;}

  /* ---------- Mode veille de nuit ---------- */
  .night{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;cursor:pointer;}
  .night.open{display:flex;}
  .night .n-time{font-size:min(22vw,38vh);color:#c4541c;line-height:1;}
  .night .n-date{font-size:min(6vw,8vh);color:#7a3a18;display:flex;flex-direction:row;gap:0.6em;align-items:center;}
  .night .moon{width:1.6em;height:1.6em;opacity:0.6;}
</style>
</head>
<body>

<div class="bar" id="bar">
  <span class="ico" id="btnToday" role="button" aria-label="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="2" fill="currentColor"/></svg></span>
  <span class="ico" id="btnDial" role="button" aria-label="dial"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span>
  <span class="ico" id="btnNight" role="button" aria-label="night"><svg viewBox="0 0 24 24"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.8"/></svg></span>
  <span class="ico" id="btnShare" role="button" aria-label="share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg></span>
  <span class="ico" id="btnPlace" role="button" aria-label="position"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg></span>
  <span class="ico" id="btnAdjust" role="button" aria-label="adjust"><svg viewBox="0 0 24 24"><path d="M15.5 4.5A8 8 0 1 0 15.5 19.5A6.5 6.5 0 0 1 15.5 4.5z"/><path d="M19 9v6M16 12h6"/></svg></span>
  <span class="ico warn" id="btnBattery" role="button" aria-label="battery" style="display:none"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10.5v3M7 10l3 4M10 10l-3 4"/></svg></span>
  <span class="grow"></span>
</div>

<main class="panel" id="panel">
  <section class="info" id="info">
    <div class="lbl" id="lblGuuru"></div>
    <div class="clock" id="clock"></div>
    <svg class="dial" id="dial" viewBox="0 0 200 200" aria-hidden="true"></svg>

    <div class="hr"></div>

    <div class="row2">
      <div>
        <div class="lbl" id="lblHan"></div>
        <div class="val" id="dayName"></div>
      </div>
      <div class="vline"></div>
      <div>
        <div class="lbl" id="lblHado"></div>

      </div>

    <div class="hr"></div>

    <div class="lbl" id="lblHadu"></div>

  <section class="cal" id="cal">

      <span class="nav" id="prevMonth" role="button" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
      <div class="cal-titles">
        <div class="cal-greg" id="calGreg"></div>
        <div class="cal-lunar" id="calLunar"></div>
      </div>
      <span class="nav" id="nextMonth" role="button" aria-label="next"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span>
    </div>
    <div class="grid" id="weekdays"></div>
    <div class="grid" id="days"></div>
  </section>
</main>

<div class="foot">By MAIGUS</div>

<!-- Détail d'un jour -->
<div class="sheet-bg" id="daySheetBg">
  <div class="sheet" id="daySheet">
    <div class="mid" id="dsDayName"></div>
    <div class="big" id="dsLunar"></div>

<!-- Réglage du début de mois lunaire (+/- jours) -->
<div class="sheet-bg" id="adjSheetBg">
  <div class="sheet">
    <div class="lbl" id="adjLbl"></div>
    <div class="big" id="adjPreview"></div>

      <span class="ico" id="adjPlus" role="button" aria-label="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>

</div>

<!-- Mode veille de nuit -->
<div class="night" id="night">
  <div class="n-time" id="nTime"></div>
  <div class="n-date"><span id="nDay"></span><svg class="moon" id="nMoon" viewBox="0 0 100 100" aria-hidden="true"></svg><span id="nLunar"></span></div>
</div>

<script>
(function(){
"use strict";

/* =====================================================================
   RÉGLAGES DU CALENDRIER (à confirmer par Maïgus)
   ===================================================================== */
// Année songhay lunaire = année de l'Hégire + 2577 (calée sur les dates de
// référence : 15 juillet 2025 = 19e jour du 1er mois 4024).
const LUNAR_YEAR_OFFSET = 2577;
// Année affichée sur la ligne grégorienne = année grégorienne + 2001
// (convention de la version 1.1, en attente de confirmation).
const GREG_YEAR_OFFSET = 2001;
// Premier jour de la semaine : samedi (duhãtedji) ; dernier : vendredi (zĩbuza).
// (0 = dimanche ... 6 = samedi)
const WEEK_START = 6;
// Jours chômés : samedi et vendredi.
const OFF_DAYS = [6, 5];
// Le jour lunaire change au coucher du soleil, LÀ OÙ L'ON SE TROUVE.
// Lieu utilisé pour le coucher du soleil :
//  1) la position donnée avec le bouton « position » (gardée sur l'appareil,
//     jamais envoyée nulle part) ;
//  2) sinon la grande ville du fuseau horaire de l'appareil ;
//  3) sinon une estimation d'après le décalage horaire (Gao pour UTC+0).
const GAO = [16.2666, -0.0447];
const FUSEAUX = {
  'Africa/Bamako':[16.27,-0.04], 'Africa/Niamey':[13.51,2.11], 'Africa/Ouagadougou':[12.37,-1.52],
  'Africa/Porto-Novo':[6.50,2.60], 'Africa/Lome':[6.13,1.22], 'Africa/Accra':[5.60,-0.19],
  'Africa/Lagos':[6.52,3.38], 'Africa/Casablanca':[33.57,-7.59], 'Africa/Algiers':[36.75,3.06],
  'Africa/Abidjan':[5.36,-4.01], 'Africa/Khartoum':[15.50,32.56], 'Africa/Ndjamena':[12.13,15.06],
  'Africa/Dakar':[14.69,-17.44], 'Africa/Nouakchott':[18.08,-15.98], 'Africa/Conakry':[9.64,-13.58],
  'Africa/Freetown':[8.48,-13.23], 'Africa/Monrovia':[6.30,-10.80], 'Africa/Banjul':[13.45,-16.58],
  'Africa/Bissau':[11.86,-15.60], 'Africa/Tripoli':[32.89,13.19], 'Africa/Tunis':[36.81,10.18],
  'Africa/Cairo':[30.04,31.24], 'Africa/Douala':[4.05,9.70], 'Africa/Libreville':[0.39,9.45],
  'Africa/Kinshasa':[-4.32,15.31], 'Africa/Nairobi':[-1.29,36.82], 'Africa/Johannesburg':[-26.20,28.05],
  'Europe/Paris':[48.86,2.35], 'Europe/Brussels':[50.85,4.35], 'Europe/Madrid':[40.42,-3.70],
  'Europe/Rome':[41.90,12.50], 'Europe/Berlin':[52.52,13.40], 'Europe/London':[51.51,-0.13],
  'Europe/Lisbon':[38.72,-9.14], 'Europe/Amsterdam':[52.37,4.90], 'Europe/Zurich':[47.37,8.54],
  'Europe/Istanbul':[41.01,28.98], 'Asia/Riyadh':[24.71,46.68], 'Asia/Dubai':[25.20,55.27],
  'Asia/Qatar':[25.29,51.53], 'Asia/Shanghai':[31.23,121.47], 'Asia/Kolkata':[28.61,77.21],
  'America/New_York':[40.71,-74.01], 'America/Toronto':[43.65,-79.38], 'America/Montreal':[45.50,-73.57],
  'America/Chicago':[41.88,-87.63], 'America/Denver':[39.74,-104.99], 'America/Los_Angeles':[34.05,-118.24],
  'America/Sao_Paulo':[-23.55,-46.63]
};
function lieuFuseau(){
  try { const z = Intl.DateTimeFormat().resolvedOptions().timeZone; if (FUSEAUX[z]) return FUSEAUX[z]; } catch(e) {}
  const h = -new Date().getTimezoneOffset() / 60;
  return h === 0 ? GAO : [15, h * 15];
}
let LIEU = null;   // [latitude, longitude] donnée par le bouton « position »
try { const v = JSON.parse(localStorage.getItem('lieu') || 'null'); if (v && isFinite(v[0]) && isFinite(v[1])) LIEU = v; } catch(e) {}
function lieu(){ return LIEU || lieuFuseau(); }

/* =====================================================================
   GLYPHES AYNEHA (Plan 16, police ayneha_pro.ttf)
   g("8B 9C") -> U+10FF8B U+10FF9C
   ===================================================================== */
const g = s => s.split(' ').map(b => String.fromCodePoint(0x10FF00 + parseInt(b,16))).join('');
const DIG = ['7C','7D','7E','7F','80','81','82','83','84','85'].map(g);

const LBL = {
  guuru: g('98 AB 8F A0'),   // guuru (heure)
  han:   g('9A 9C BC'),      // han (jour)
  hadu:  g('9A A2 8B A0'),   // hãdu (mois)
  hado:  g('9A A2 8B 9F'),   // hãdo (lune)
  jiiri: g('94 A6 8F 9E')    // jiiri (année)
};

// Jours de la semaine, index 0 = dimanche (ordre de JavaScript getDay()) :
// fahãtedji, mahãtedji, bohãtedji, woyhãtedji, tohãtedji, zĩbuza, duhãtedji.
const DAYS_FULL = [
  '89 9C 9A A2 8C 9D 95 9E', '88 9C 9A A2 8C 9D 95 9E', '86 9F 9A A2 8C 9D 95 9E',
  '8A 9F CC 9A A2 8C 9D 95 9E', '8C 9F 9A A2 8C 9D 95 9E', '91 A7 86 A0 91 9C',
  '8B A0 9A A2 8C 9D 95 9E'
].map(g);
const DAYS_SHORT = ['89 9C 9A','88 9C 9A','86 9F 9A','8A 9F CC','8C 9F 9A','91 A7 86','8B A0 9A'].map(g);

// Les 12 mois songhay (lunaires), index 0 = 1er mois du jiiri :
// dadaw-beeri, dadaw-kayna, gaani, gaani-bãda, bĩkuna, bĩbina, woyzena,
// cekɔnna, meehaw, meefeeri, hunãzam, cibsi.
const LUNAR_MONTHS = [
  '8B 9C 8B 9C B6 86 A3 8F 9E', '8B 9C 8B 9C B6 99 9C CC 8D 9C', '98 A1 8D 9E',
  '98 A1 8D 9E 86 A2 8B 9C', '86 A7 99 A0 8D 9C', '86 A7 86 9E 8D 9C',
  '8A 9F CC 91 9D 8D 9C', '93 9D 99 AA BB 9C', '88 A3 9A 9C B6',
  '88 A3 89 A3 8F 9E', '9A A0 8D A2 91 9C B2', '93 9E AE 90 9E'
].map(g);

// Fêtes d'indépendance des pays où vit une communauté songhay établie
// depuis des siècles (dates grégoriennes) : [mois, jour, code, nom].
const INDEP = [

   Le texte reste dans l'ordre logique ; chaque glyphe devient une case,
   et le navigateur place la première case à droite. Aucune inversion.
   ===================================================================== */
function ay(text){
  const box = document.createElement('span');
  box.className = 'ay';
  for (const ch of text) {
    const s = document.createElement('span');
    if (ch === ':' || ch === '.' || ch === ' ') { s.className = 'sep'; s.textContent = ch === ' ' ? ' ' : ch; }
    else s.textContent = ch;
    box.appendChild(s);
  }
  return box;
}

/* =====================================================================
   CALENDRIER LUNAIRE, CALÉ SUR LA VRAIE LUNE (même calendrier partout)
   Chaque mois commence le lendemain du premier soir où le croissant de
   lune est visible à l'oeil nu quelque part sur Terre, au coucher du
   soleil avant minuit UTC (critère astronomique d'Odeh, 2004). Ainsi le
   calendrier est le même pour tous : Sahel, Afrique et diaspora.
   Les débuts de mois de 1899 à 2201 sont précalculés (éphémérides) et
   rangés dans MOIS_LUNE : 1 bit par mois, 1 = mois de 30 jours,
   0 = mois de 29 jours. En dehors de cette période : cycle arithmétique.
   Le bouton de réglage (+/- 2 jours) permet de suivre l'annonce locale.
   ===================================================================== */
const MOIS_LUNE = {jd0: 2414785.5, y0: 1317, n: 3732,
  hex: 'b5556a9754b725752ba9572ab5555aa5d52da95d49ea4ed26d555aa5b52b6a5751ba8bb49b54d6a5ad4b5a55d49ea2dd15e52ea96d4ada95b4aba93b45ba2baa5b52b6956b2ad94ed26e8aec56d2aea56b2ad555b29b94bb15b4aba55b4ab5556a96d4aea96d46e9574a75555aaad52da95b51ba8dd45b94daa6b54b6a56d2aea2f516e8b6a96d4b5a95b4aba53d45da2dd15d52da95b4ab6956c9764af45752b6956d2ad555b25b92bc95d4ada55d2ad5556aab54b6a5752769374ab6556aaad52da95d4ada4dd26d935aa6b5556a5752b693749764b725b54b6a56d4ada4dd25e92ec96d4ada96b4ab695749764bb25b52b695b4ab5955d26d92dc95e4aea56d2ad555aaab54bb25792ba95b4ab655aaaad54ea96d4aea56d26e936caad555aa5b52ba95b49ba4bb25b54d6a9ad4aea56d26e92f49754b6a56d52da95b49ba4bb25d92da95b4ab5956d2ae92ec96e4aea5752b5956aaaba4bb25d92bc95d4ada55b2ab5556c96d4aea5752b6936caad555aa6b52ba95d49da4dd26d555aa9b54b6a57527693749764b6a5ad52da95d4ada4dd25d92da96d4ada95ad2b693749764b725752b6956caada55d25d92ec95d4aea56b2ab5556c9b64b725752ba95b4ab5556aa6d52dc95d4aea4ed2ad555aaab5'};
const ISL_EPOCH = 1948439.5;
function gregToJd(y,m,d){ return Date.UTC(y,m-1,d)/86400000 + 2440587.5; }
function islToJdA(y,m,d){
  return d + Math.ceil(29.5*(m-1)) + (y-1)*354 + Math.floor((3+11*y)/30) + ISL_EPOCH - 1;
}
function jdToIslA(jd){
  jd = Math.floor(jd) + 0.5;
  const y = Math.floor((30*(jd - ISL_EPOCH) + 10646) / 10631);
  const m = Math.min(12, Math.ceil((jd - (29 + islToJdA(y,1,1))) / 29.5) + 1);
  const d = jd - islToJdA(y,m,1) + 1;
  return {y, m, d};
}
// MOIS_DEBUT[i] = jour julien du 1er jour du i-ème mois du tableau.
const MOIS_DEBUT = (function(){
  const t = [MOIS_LUNE.jd0];
  for (let i = 0; i < MOIS_LUNE.n; i++) {
    const bit = (parseInt(MOIS_LUNE.hex[i >> 2], 16) >> (3 - (i & 3))) & 1;
    t.push(t[i] + (bit ? 30 : 29));
  }
  return t;
})();
function islToJd(y,m,d){
  const i = (y - MOIS_LUNE.y0)*12 + (m - 1);
  if (i >= 0 && i <= MOIS_LUNE.n) return MOIS_DEBUT[i] + d - 1;
  return islToJdA(y,m,d);
}
function jdToIsl(jd){
  jd = Math.floor(jd) + 0.5;
  if (jd < MOIS_DEBUT[0] || jd >= MOIS_DEBUT[MOIS_LUNE.n]) return jdToIslA(jd);
  let lo = 0, hi = MOIS_LUNE.n - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (MOIS_DEBUT[mid] <= jd) lo = mid; else hi = mid - 1; }
  return {y: MOIS_LUNE.y0 + Math.floor(lo/12), m: lo % 12 + 1, d: jd - MOIS_DEBUT[lo] + 1};
}
// Date lunaire du jour (de jour) correspondant à une date grégorienne.
function lunarOf(y,m,d){
  const r = jdToIsl(gregToJd(y,m,d) - adjust());
  return {d:r.d, m:r.m, y:r.y + LUNAR_YEAR_OFFSET};
}

/* Coucher du soleil au lieu choisi (équation du lever/coucher, précision ~1 min). */
function sunsetMs(y,m,d){
  const rad = Math.PI/180;
  // n = nombre de jours depuis le 1er janvier 2000 à midi (jour local).
  const n = Math.round(gregToJd(y,m,d) + 0.5 - 2451545.0);
  const [LAT, LON] = lieu();
  const Js = n - LON/360;
  const M = (357.5291 + 0.98560028*Js) % 360;
  const C = 1.9148*Math.sin(M*rad) + 0.02*Math.sin(2*M*rad) + 0.0003*Math.sin(3*M*rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053*Math.sin(M*rad) - 0.0069*Math.sin(2*L*rad);
  const dec = Math.asin(Math.sin(L*rad)*Math.sin(23.4397*rad));
  const cw = (Math.sin(-0.833*rad) - Math.sin(LAT*rad)*Math.sin(dec)) / (Math.cos(LAT*rad)*Math.cos(dec));
  const w = Math.acos(Math.max(-1, Math.min(1, cw))) / rad;
  return (Jt + w/360 - 2440587.5) * 86400000;
}
// Date lunaire « maintenant » : après le coucher du soleil, c'est déjà le jour suivant.
function lunarNow(now){
  const y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  if (now.getTime() >= sunsetMs(y,m,d)) {
    const t = new Date(y, m-1, d+1);
    return lunarOf(t.getFullYear(), t.getMonth()+1, t.getDate());
  }
  return lunarOf(y,m,d);
}

/* Âge de la lune (jours depuis la nouvelle lune) pour le dessin de hãdo. */
function moonAge(date){
  const jd = date.getTime()/86400000 + 2440587.5;
  const syn = 29.530588853;
  let a = (jd - 2451550.26) % syn;
  if (a < 0) a += syn;
  return a;
}
function drawMoon(svg, date){
  const p = moonAge(date) / 29.530588853;     // 0 = nouvelle lune, 0,5 = pleine lune
  const r = 44, cx = 50, cy = 50;
  const k = Math.cos(2*Math.PI*p);
  const rx = Math.abs(k) * r;
  const waxing = p < 0.5;
  const outer = waxing ? 1 : 0;
  const inner = waxing ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
  const lit = `M ${cx} ${cy-r} A ${r} ${r} 0 0 ${outer} ${cx} ${cy+r} A ${rx} ${r} 0 0 ${inner} ${cx} ${cy-r} Z`;
  svg.innerHTML =
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--moon-dark)" stroke="rgba(243,236,224,0.25)" stroke-width="1.5"/>` +
    `<path d="${lit}" fill="var(--moon-lit)"/>`;
}

/* Lundi de Pâques (calcul de Meeus). */
function lundiPaques(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
        g2=Math.floor((b-f+1)/3),h=(19*a+b-d-g2+15)%30,i=Math.floor(c/4),k=c%4,
        l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  const t = new Date(y, mo-1, da+1);
  return [t.getMonth()+1, t.getDate()];
}
/* Toutes les fêtes d'un jour : indépendances, fêtes officielles du Mali, fêtes religieuses. */
function fetesDu(y,m,d,lun){
  const rel = FETES_REL_GREG.filter(f => f[0]===m && f[1]===d)
    .concat(FETES_REL_LUNE.filter(f => f[0]===lun.m && f[1]===lun.d));
  const pq = lundiPaques(y);
  if (pq[0]===m && pq[1]===d) rel.push([m,d,'Lundi de Pâques','Easter Monday']);
  return {
    indep: INDEP.filter(f => f[0]===m && f[1]===d),
    mali: FETES_MALI.filter(f => f[0]===m && f[1]===d),
    rel
  };
}

function etoile(cx, cy, r, fill){
  let p = '';

    const a = -Math.PI/2 + i*Math.PI/5, rr = i % 2 ? r*0.382 : r;
    p += (i ? 'L' : 'M') + (cx + rr*Math.cos(a)).toFixed(2) + ' ' + (cy + rr*Math.sin(a)).toFixed(2);
  }
  return `<path d="${p}Z" fill="${fill}"/>`;
}

/* --- Calendrier (mois lunaire songhay ; jours grégoriens en petit) --- */
// viewY / viewM = année et mois lunaires affichés (année de calcul, sans +2577).
let viewY, viewM, selectedKey = '';
function jdToGreg(jd){
  const d = new Date(Math.round((jd - 2440587.5) * 86400000));
  return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1, d:d.getUTCDate()};
}
function lunarMonthSpan(y, m){
  const start = islToJd(y, m, 1) + adjust();
  const next = (m === 12 ? islToJd(y+1, 1, 1) : islToJd(y, m+1, 1)) + adjust();
  return {start, len: Math.round(next - start)};
}
function setViewToToday(){
  const n = new Date();
  const r = jdToIsl(gregToJd(n.getFullYear(), n.getMonth()+1, n.getDate()) - adjust());
  viewY = r.y; viewM = r.m;
}
function renderCalendar(){
  const now = new Date();
  const span = lunarMonthSpan(viewY, viewM);
  const t = jdToIsl(gregToJd(now.getFullYear(), now.getMonth()+1, now.getDate()) - adjust());
  $('btnToday').classList.toggle('idle', t.y === viewY && t.m === viewM && !selectedKey);

  // Titre : le mois lunaire songhay et son jiiri.
  $('calGreg').replaceChildren(ay(LUNAR_MONTHS[viewM-1]), ay(' ' + num(viewY + LUNAR_YEAR_OFFSET)));

  // Sous-titre : les mois grégoriens qui chevauchent ce mois lunaire.
  const g0 = jdToGreg(span.start), g1 = jdToGreg(span.start + span.len - 1);
  const cl = $('calLunar');
  cl.replaceChildren();
  let gy = g0.y, gm = g0.m;
  while (true) {
    if (cl.childNodes.length) { const d = document.createElement('span'); d.className = 'dot'; d.textContent = '|'; cl.appendChild(d); }
    cl.appendChild(ay(num2(gm) + '/' + num(gy + GREG_YEAR_OFFSET)));
    if (gy === g1.y && gm === g1.m) break;
    gm++; if (gm > 12) { gm = 1; gy++; }
    if (cl.childNodes.length > 6) break;
  }

  const wd = $('weekdays');
  wd.replaceChildren();
  for (let i = 0; i < 7; i++) {
    const e = document.createElement('div');
    e.className = 'wd';
    if (OFF_DAYS.includes((WEEK_START + i) % 7)) e.classList.add('off');
    e.appendChild(ay(DAYS_SHORT[(WEEK_START + i) % 7]));
    wd.appendChild(e);
  }

  const days = $('days');
  days.replaceChildren();
  const g0date = new Date(g0.y, g0.m-1, g0.d);
  const lead = (g0date.getDay() - WEEK_START + 7) % 7;
  for (let i = 0; i < lead; i++) { const e = document.createElement('div'); e.className = 'day empty'; days.appendChild(e); }
  for (let i = 0; i < span.len; i++) {
    const g = jdToGreg(span.start + i);
    const lun = {d: i+1, m: viewM, y: viewY + LUNAR_YEAR_OFFSET};
    const cell = document.createElement('div');
    cell.className = 'day';
    if (OFF_DAYS.includes(new Date(g.y, g.m-1, g.d).getDay())) cell.classList.add('off');
    if (g.d === 1) cell.classList.add('mstart');           // 1er jour d'un mois grégorien
    if (g.y === now.getFullYear() && g.m === now.getMonth()+1 && g.d === now.getDate()) cell.classList.add('today');
    const key = g.y + '-' + g.m + '-' + g.d;
    if (key === selectedKey) cell.classList.add('sel');
    const big = document.createElement('span'); big.className = 'big'; big.appendChild(ay(num(lun.d)));
    const small = document.createElement('span'); small.className = 'small'; small.appendChild(ay(num(g.d)));
    cell.append(big, small);
    const fe = fetesDu(g.y, g.m, g.d, lun);
    if (fe.indep.length || fe.mali.length || fe.rel.length) {
      const pt = document.createElement('span'); pt.className = 'pastilles';
      if (fe.indep.length) { const e = document.createElement('i'); e.className = 'fete'; pt.appendChild(e); }
      if (fe.mali.length) { const e = document.createElement('i'); e.className = 'fete-mali'; pt.appendChild(e); }
      if (fe.rel.length) { const e = document.createElement('i'); e.className = 'fete-rel'; pt.appendChild(e); }
      cell.appendChild(pt);
    }
    cell.addEventListener('click', () => openDay(g.y, g.m-1, g.d));
    days.appendChild(cell);
  }
}
function moveMonth(step){
  viewM += step;
  if (viewM < 1) { viewM = 12; viewY--; }
  if (viewM > 12) { viewM = 1; viewY++; }
  renderCalendar();
}
$('prevMonth').addEventListener('click', () => moveMonth(-1));
$('nextMonth').addEventListener('click', () => moveMonth(1));
$('btnToday').addEventListener('click', () => { setViewToToday(); selectedKey = ''; renderCalendar(); });
// Glisser le doigt : en RTL, le mois suivant arrive par la gauche.
(function swipe(){
  let x0 = null, y0 = null;
  const c = $('cal');
  c.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  c.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMonth(dx > 0 ? 1 : -1);
    x0 = null;
  }, {passive:true});
})();

/* --- Détail d'un jour --- */
function openDay(y, m, d){
  selectedKey = y + '-' + (m+1) + '-' + d;
  renderCalendar();
  const date = new Date(y, m, d, 12);
  const lun = lunarOf(y, m+1, d);
  put($('dsDayName'), dayNumText(date.getDay(), lun.d));
  put($('dsLunar'), LUNAR_MONTHS[lun.m-1]);
  put($('dsYear'), num(lun.y));
  drawMoon($('dsMoon'), date);
  put($('dsGreg'), gregText(y, m+1, d));
  const fe = fetesDu(y, m+1, d, lun);
  const ligne = (cls, f) => { const e = document.createElement('div'); e.className = 'fete-ligne';
    const p = document.createElement('i'); p.className = cls; e.append(p, document.createTextNode(f[0])); return e; };
  const pays = fe.indep.map(f => { const e = document.createElement('span'); e.className = 'fete-pays'; e.title = f[4];
    e.innerHTML = drapeau(f[2]); const n = document.createElement('span'); n.className = 'pays'; n.appendChild(ay(g(f[3]))); e.appendChild(n); return e; });
  $('dsFetes').replaceChildren(...pays, ...fe.mali.map(f => ligne('fete-mali', f.slice(2))), ...fe.rel.map(f => ligne('fete-rel', f.slice(2))));
  $('daySheetBg').classList.add('open');
}
$('daySheetBg').addEventListener('click', () => $('daySheetBg').classList.remove('open'));

/* --- Réglage du début de mois (+/- 2 jours) --- */
function renderAdj(){
  const n = new Date();
  put($('adjPreview'), lunarText(lunarNow(n)));
  put($('adjNum'), (adjust() > 0 ? '+' : adjust() < 0 ? '-' : '') + num(Math.abs(adjust())));
}
/* --- Bouton « position » : coucher du soleil calculé là où l'on se trouve --- */
if (App && App.getPlace && !LIEU) {
  try { const v = String(App.getPlace() || '').split(','); if (v.length === 2 && isFinite(+v[0]) && isFinite(+v[1]) && v[0] !== '') LIEU = [+v[0], +v[1]]; } catch(e) {}
}
function renderPlace(){ $('btnPlace').classList.toggle('on', !!LIEU); }
renderPlace();
$('btnPlace').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    // Position arrondie (environ 1 km) : suffisant pour le coucher du soleil.
    LIEU = [Math.round(p.coords.latitude*100)/100, Math.round(p.coords.longitude*100)/100];
    try { localStorage.setItem('lieu', JSON.stringify(LIEU)); } catch(e) {}
    if (App && App.setPlace) { try { App.setPlace(LIEU[0], LIEU[1]); } catch(e) {} }
    renderPlace(); lastLunarKey = ''; tick();
  }, () => {}, {enableHighAccuracy: false, timeout: 20000, maximumAge: 3600000});
});
$('btnAdjust').addEventListener('click', () => { renderAdj(); $('adjSheetBg').classList.add('open'); });
$('adjSheetBg').addEventListener('click', e => { if (e.target === $('adjSheetBg')) $('adjSheetBg').classList.remove('open'); });
$('adjPlus').addEventListener('click', () => { setAdjust(adjust() + 1); setViewToToday(); renderAdj(); tick(); renderCalendar(); });
$('adjMinus').addEventListener('click', () => { setAdjust(adjust() - 1); setViewToToday(); renderAdj(); tick(); renderCalendar(); });

/* --- Cadran à aiguilles (choix mémorisé) --- */
function setDial(on){
  document.body.classList.toggle('dial-mode', on);
  $('btnDial').classList.toggle('on', on);
  try { localStorage.setItem('dialMode', on ? '1' : '0'); } catch(e) {}
  if (on) drawHands(new Date());
}
$('btnDial').addEventListener('click', () => setDial(!document.body.classList.contains('dial-mode')));
$('clock').addEventListener('click', () => setDial(true));
dial.addEventListener('click', () => setDial(false));
try { if (localStorage.getItem('dialMode') === '1') setDial(true); } catch(e) {}

/* --- Mode veille de nuit --- */
let wakeLock = null;
function renderNight(now, lun){
  put($('nTime'), timeText(now, false));
  put($('nDay'), dayNumText(now.getDay(), lun.d));
  put($('nLunar'), LUNAR_MONTHS[lun.m-1]);
  drawMoon($('nMoon'), now);
}
async function setNight(on){
  $('night').classList.toggle('open', on);
  if (on) renderNight(new Date(), lunarNow(new Date()));
  if (App && App.setNightMode) { try { App.setNightMode(on); } catch(e) {} return; }
  try {
    if (on) {
      if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      // Le mode veille suit la position du téléphone (portrait ou paysage).
      if (screen.orientation && screen.orientation.unlock) { try { screen.orientation.unlock(); } catch(e) {} }
    } else {
      if (wakeLock) { await wakeLock.release(); wakeLock = null; }
      if (document.fullscreenElement) await document.exitFullscreen();
    }
  } catch(e) {}
}
$('btnNight').addEventListener('click', () => setNight(true));
$('night').addEventListener('click', () => setNight(false));
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && $('night').classList.contains('open') && !App && navigator.wakeLock) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
  }
});

/* --- Partager la date du jour en image --- */
async function makeShareImage(){
  await document.fonts.load('40px "AYNEHA"', DIG[0]);
  const W = 1080, H = 1080;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const grd = x.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#13213a'); grd.addColorStop(1, '#08101e');
  x.fillStyle = grd; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#ff6a13'; x.lineWidth = 10; x.strokeRect(40, 40, W-80, H-80);

  // Écrit un texte AYNEHA centré, glyphe par glyphe de droite à gauche.
  const rtl = (text, size, color, yy) => {
    x.font = size + 'px "AYNEHA"'; x.fillStyle = color; x.textBaseline = 'alphabetic';
    const gl = [...text].map(ch => ({ch, w: x.measureText(ch).width + size*0.04}));
    const tw = gl.reduce((s,a) => s + a.w, 0);
    let px = W/2 + tw/2;
    for (const a of gl) { px -= a.w; x.fillText(a.ch, px, yy); }
  };
  const now = new Date(), lun = lunarNow(now);
  rtl(timeText(now, false), 190, '#ff8a3d', 330);
  rtl(dayNumText(now.getDay(), lun.d), 96, '#f3ece0', 500);
  rtl(LUNAR_MONTHS[lun.m-1], 110, '#ff8a3d', 650);
  rtl(num(lun.y), 96, '#f3ece0', 790);
  rtl(gregText(now.getFullYear(), now.getMonth()+1, now.getDate()), 60, '#b9c0cf', 900);

  // Petite lune en haut à gauche.
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  drawMoon(svg, now);
  const src = svg.outerHTML.replace('var(--moon-dark)','#22324f').replace('var(--moon-lit)','#f6e7c8');
  await new Promise(res => {
    const img = new Image();
    img.onload = () => { x.drawImage(img, 90, 90, 130, 130); res(); };
    img.onerror = res;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
  });
  // Filigrane.
  x.font = '600 34px system-ui, sans-serif'; x.fillStyle = 'rgba(243,236,224,0.55)'; x.textAlign = 'center';
  x.fillText('AYNEHA  -  ayneha.org', W/2, H - 80);
  return c;
}
$('btnShare').addEventListener('click', async () => {
  const c = await makeShareImage();
  const dataUrl = c.toDataURL('image/png');
  if (App && App.shareImage) { App.shareImage(dataUrl.split(',')[1]); return; }
  try {
    const blob = await (await fetch(dataUrl)).blob();
    const file = new File([blob], 'ayneha-horloge.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file]}); return; }
  } catch(e) {}
  const a = document.createElement('a'); a.href = dataUrl; a.download = 'ayneha-horloge.png'; a.click();
});

/* --- Batterie (application uniquement) --- */
function checkBattery(){
  if (App && App.isBatteryRestricted) {
    try { $('btnBattery').style.display = App.isBatteryRestricted() ? '' : 'none'; } catch(e) {}
  }
}
$('btnBattery').addEventListener('click', () => { if (App && App.openBatterySettings) App.openBatterySettings(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkBattery(); tick(); } });
window.aynehaRefresh = () => { checkBattery(); tick(); };

/* --- Démarrage --- */
document.fonts.load('20px "AYNEHA"', DIG[0]).finally(() => { tick(); checkBattery(); });
tick();
setInterval(tick, 1000);

if ('serviceWorker' in navigator && location.protocol === 'https:' && !App) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
}

// Accès pour les tests automatiques.
window.__ayneha = {lunarOf, lunarNow, sunsetMs, jdToIsl, gregToJd};
})();
</script>
